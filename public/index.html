<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120b10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>IdeaX</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <script>
    // set the theme before first paint
    document.documentElement.dataset.theme = localStorage.getItem('wb-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" hidden>
    <header id="top">
      <div class="brand"><span class="logo"></span><b id="title">IdeaX</b></div>
      <input id="search" type="search" placeholder="Search everything…" autocomplete="off">
      <div class="tools">
        <button id="searchBtn" class="tbtn only-small" title="Search">🔍</button>
        <button id="arrange" class="tbtn gold" title="Let the agent tidy and re-arrange the whole board">✨<span class="hide-small"> Arrange</span></button>
        <button id="journalBtn" class="tbtn" title="Journal: everything you added, newest first">🕘<span class="hide-small"> Journal</span></button>
        <button id="undo" class="tbtn" title="Undo last change" disabled>↶</button>
        <button id="addSec" class="tbtn" title="Add a section">+<span class="hide-small"> Section</span></button>
        <span class="zoom hide-small"><button id="zoomOut" class="tbtn" title="Zoom out">−</button><span id="zoomLbl">100%</span><button id="zoomIn" class="tbtn" title="Zoom in">+</button></span>
        <button id="fit" class="tbtn" title="Fit to screen">⤢<span class="hide-small"> Fit</span></button>
        <button id="theme" class="tbtn hide-small" title="Light / dark">◐</button>
      </div>
    </header>

    <main id="vp"><div id="world"></div></main>
    <div id="filters" hidden></div>

    <aside id="panel" hidden>
      <div class="panel-head">
        <div class="tabs"><button data-tab="chat" class="tab">Agent</button><button data-tab="decisions" class="tab">Decisions</button><button data-tab="journal" class="tab">Journal</button></div>
        <button id="panelClose" class="tbtn">✕</button>
      </div>
      <div id="panelBody"></div>
    </aside>

    <footer id="composer">
      <div id="status" hidden></div>
      <div id="scope" hidden></div>
      <div id="atts"></div>
      <div class="row">
        <button id="chatBtn" class="cbtn" title="Open the conversation with the agent">💬</button>
        <button id="attBtn" class="cbtn" title="Add photos">📎</button>
        <textarea id="msg" rows="1" enterkeyhint="send" placeholder="Capture an idea or ask the agent…"></textarea>
        <button id="send" class="cbtn primary" title="Send">➤</button>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </footer>
  </div>

  <div id="lock" hidden>
    <form id="lockForm">
      <div class="logo big">💡</div>
      <h2>IdeaX</h2>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" autofocus>
      <button class="primary">Unlock</button>
      <p id="lockErr"></p>
    </form>
  </div>

  <div id="toasts"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
